<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets us read the safe-area insets on iPhone (the
         strip behind the home indicator + notch). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f1" />

    <!-- Google Fonts: a serif for display, a sans for body, a script for romance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />

    <title>Our Wedding</title>
    <meta name="description" content="Join us as we celebrate our union." />
  </head>
  <body>
    <!-- React mounts the whole app inside this div. -->
    <div id="root"></div>

    <!-- Vite loads our entry file. The browser starts here. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
